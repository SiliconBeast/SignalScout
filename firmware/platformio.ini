; Signal Scout firmware.
;   pio run -e device            build for the ESP32-S3 base board
;   pio run -e device -t upload  flash over USB-C
;   pio run -e sim               desktop simulator (needs libsdl2-dev)
;   pio test -e native           unit tests on the host
[platformio]
default_envs = device

[env]
build_flags =
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude

[env:device]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3-WROOM-1-N16R8: 16 MB quad flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; USB_CDC_ON_BOOT: Serial is the USB-C port. UART0 (IO43/IO44) is the sled link.
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -Wall -Wextra
build_src_filter = +<device/>
lib_deps =
  lvgl/lvgl@9.2.2
  jgromes/RadioLib@7.1.2
  h2zero/NimBLE-Arduino@1.4.3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:sim]
platform = native
build_flags =
  ${env.build_flags}
  -std=gnu++17
  -DSS_SDL
  -lSDL2
  -Wall -Wextra
build_src_filter = +<sim/>
lib_deps = lvgl/lvgl@9.2.2
lib_compat_mode = off

[env:native]
platform = native
build_flags =
  -Iinclude
  -std=gnu++17
  -DUNITY_INCLUDE_DOUBLE
  -Wall -Wextra
test_framework = unity
lib_compat_mode = off
lib_ignore = ss_ui
